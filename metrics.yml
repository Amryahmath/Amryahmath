# OPTIONAL — self-hosted profile metrics.
#
# Renders github-metrics.svg into this repo, so the README never depends on a
# third-party service staying online. Requires a repository secret named
# METRICS_TOKEN (a classic PAT with the `public_repo` scope).
#
# If you don't want this, just delete the file — the README works without it.

name: Generate Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Base metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Amryahmath
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Colombo
          config_display: large

          # Language breakdown, weighted by recent activity
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Commit-time histogram
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes

          # Isometric contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
